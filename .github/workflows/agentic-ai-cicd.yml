name: Agentic CICD Pipeline
on:
  push:
  pull_request:
permissions:
  contents: write
  pull-requests: write
  checks: write
jobs:
  security-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt
          pip install PyGithub

      - name: Run Bandit Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json --exit-zero

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          sleep 10

      - name: Pull LLM Model
        run: |
          ollama pull qwen2.5-coder

      - name: Run AI Security Agent
        if: always()
        run: |
          mkdir -p reports
          python scripts/ai_security_agent.py

      - name: Run Decision Engine
        if: always()
        run: |
          python scripts/decision_engine.py

      - name: Create Remediation PR
        if: always()
        run: |
          python scripts/create_pr.py
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-analysis
          path: reports/